<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отправка данных</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select, textarea { display: block; margin-bottom: 10px; width: 300px; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

  <h2>Форма пользователя</h2>

  <form class="user-form">
    <input type="text" name="name" class="name-input" placeholder="Имя">
    
    <input type="email" name="email" class="email-input" placeholder="Email" required>
    
    <select name="country" class="country-select">
      <option value="ru">Россия</option>
      <option value="se">Швеция</option>
      <option value="us">США</option>
    </select>
    
    <textarea name="comment" class="comment-textarea" placeholder="Комментарий"></textarea>
    
    <button type="submit">Отправить</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.querySelector(".user-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const name = formData.get("name").trim();
      const email = formData.get("email").trim();

      message.textContent = "";
      message.className = "";

      // Валидация имени
      if (name.length < 2) {
        message.textContent = "Имя должно содержать минимум 2 символа.";
        message.className = "error";
        return;
      }

      // Валидация email
      if (!email || !email.includes("@")) {
        message.textContent = "Введите корректный email.";
        message.className = "error";
        return;
      }

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Ошибка отправки");
        }

        const result = await response.json();

        message.textContent = "Данные успешно отправлены!";
        message.className = "success";

        console.log("Ответ сервера:", result);

        form.reset();
      } catch (error) {
        message.textContent = "Ошибка при отправке данных.";
        message.className = "error";
        console.error(error);
      }
    });
  </script>

</body>
</html>
