<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Проверка примера</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .correct { color: green; }
    .wrong { color: red; }
  </style>
</head>
<body>

  <h2>Решите пример:</h2>

  <div id="task">
    <input id="a1" value="2" type="number" disabled> +
    <input id="b1" value="2" type="number" disabled> =
    <input id="result1" type="number">
    <button onclick="check()">Проверить</button>
  </div>

  <p id="message"></p>

  <script>
    function check() {
      const a = Number(document.getElementById("a1").value);
      const b = Number(document.getElementById("b1").value);
      const resultInput = document.getElementById("result1");
      const userAnswer = Number(resultInput.value);
      const message = document.getElementById("message");

      // Блокируем ввод после проверки
      resultInput.disabled = true;

      // Проверка
      if (userAnswer === a + b) {
        message.textContent = "Верно!";
        message.className = "correct";
      } else {
        message.textContent = Неверно. Правильный ответ: ${a + b};
        message.className = "wrong";
      }
    }
  </script>

</body>
</html>
